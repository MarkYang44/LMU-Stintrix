name: Windows validation and portable build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      full_regression:
        description: 'Run the optional full historical regression'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Verify public source
        run: python tools/audit_publication.py --no-checksums
      - name: Install verified build dependencies
        run: python tools/install_dependencies.py --build
      - name: Install pinned reduced 7z console
        run: python tools/install_7zip.py --no-checksums
      - name: Select a verified native compression fixture volume
        run: python tools/compression_fixture.py
      - name: Generate reviewed branding resources
        run: python tools/build_brand.py
      - name: Run change-related isolated checks
        env:
          STINTRIX_FULL_TESTS: ${{ inputs.full_regression }}
          STINTRIX_TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ($env:STINTRIX_FULL_TESTS -eq 'true') {
            python tools/run_tests.py --full
          } else {
            $testBase = $env:STINTRIX_TEST_BASE
            if ($env:GITHUB_REF -like 'refs/tags/*') {
              $testBase = git describe --tags --match 'v*' --abbrev=0 'HEAD^'
              if ($LASTEXITCODE -ne 0) { $testBase = 'HEAD^' }
            }
            if (-not $testBase -or $testBase -match '^0+$') { $testBase = 'HEAD^' }
            python tools/run_tests.py --base $testBase
          }
          if ($LASTEXITCODE -ne 0) { throw 'Selected checks failed' }
      - name: Build independent portable ZIP
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: python tools/build.py --no-checksums
      - name: Validate clean portable package
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: python tools/check_bundle.py --no-checksums --smoke
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: LMU-Stintrix-windows-x64
          path: |
            dist/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: LMU-Stintrix-windows-x64
          path: dist
      - name: Publish verified Release for a version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match VERSION' }
          gh release view $env:GITHUB_REF_NAME --json id 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME "dist/LMU-Stintrix-v$version-windows-x64.zip" --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
            gh release edit $env:GITHUB_REF_NAME --latest --title "LMU Stintrix v$version" --notes-file docs/RELEASE_NOTES.md
          } else {
            gh release create $env:GITHUB_REF_NAME "dist/LMU-Stintrix-v$version-windows-x64.zip" --verify-tag --latest --title "LMU Stintrix v$version" --notes-file docs/RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
